# Public flight subdomain — only / and /log are valid paths
server {
    listen 80;
    server_name flight.jerry.tw;
    root /var/www/public;
    index index.php index.html;

    location = /build/sw.js {
        add_header Service-Worker-Allowed /;
    }

    # Static assets
    location /build/ {
        try_files $uri =404;
    }

    # API pass-through
    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Home and log pages — serve the SPA entry point; browser URL stays unchanged
    location = / {
        try_files $uri /index.php?$query_string;
    }

    location = /log {
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Everything else → redirect to /
    location / {
        return 301 /;
    }
}

# Main app
server {
    listen 80;
    server_name _;
    index index.php index.html;
    root /var/www/public;

    # Allow service worker at /build/sw.js to control scope /
    location = /build/sw.js {
        add_header Service-Worker-Allowed /;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
